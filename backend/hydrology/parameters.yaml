unit_hydrograph:
  source: USDA NRCS, NEH Parte 630, cap. 16 (marzo 2007), Tabla 16-1 y ec. 16A-6
  peak_rate_factor: 484
  peak_rate_note: >-
    NEH 630 cap. 16 cita que el factor de pico varía de unos 600 en terreno empinado a 300 en
    llanuras muy planas, y estudios recientes lo ubican entre menos de 100 y más de 600. En la
    llanura pampeana el valor estándar 484 probablemente sobreestima el caudal pico.
  # el intervalo de cálculo no debe superar 0,25 Tp (se usa 0,2 Tp)
  max_step_ratio: 0.2
  # t/Tp: q/qp
  ratios:
    - [0.0, 0.000]
    - [0.1, 0.030]
    - [0.2, 0.100]
