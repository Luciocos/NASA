lag:
  source: USDA NRCS, NEH Parte 630, cap. 15 (mayo 2010), ec. 15-4a (Mockus 1961)
  equation: L = l^0.8 (S + 1)^0.7 / (1900 Y^0.5), L en h, l en pies, S en pulgadas, Y en %
  cn_min: 50
  cn_max: 95
  # desarrollada con cuencas de hasta 9,2 mi2 (mayoría < 2000 acres); límite razonable 19 mi2
  max_area_km2: 49.2
  typical_area_km2: 8.1
