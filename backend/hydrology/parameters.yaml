# Parámetros del modelo de lluvia-escorrentía de la pestaña Cuenca y Caudal.
# Cada valor numérico tiene su fuente (documento, tabla o ecuación). Las decisiones de modelado
# sin fuente numérica se marcan como "assumption" y la interfaz las muestra como supuestos.

curve_numbers:
  source: USDA NRCS, TR-55 Urban Hydrology for Small Watersheds (2.a ed., junio 1986)
  # Valores para condición de escurrimiento media (ARC II) e Ia = 0,2 S
  covers:
    row_crops_sr_cr_good:
      label: Cultivos en hilera, surco recto con rastrojo, condición buena
      table: TR-55 Tabla 2-2b
      cn: {A: 64, B: 75, C: 82, D: 85}
    row_crops_sr_good:
      label: Cultivos en hilera, surco recto sin rastrojo, condición buena
      table: TR-55 Tabla 2-2b
      cn: {A: 67, B: 78, C: 85, D: 89}
    pasture_fair:
      label: Pastizal o pastura, condición regular
      table: TR-55 Tabla 2-2c
      cn: {A: 49, B: 69, C: 79, D: 84}
    woods_grass_fair:
      label: Combinación de monte y pasto, condición regular
      table: TR-55 Tabla 2-2c
      cn: {A: 43, B: 65, C: 76, D: 82}
    woods_fair:
      label: Monte, condición regular
      table: TR-55 Tabla 2-2c
      cn: {A: 36, B: 60, C: 73, D: 79}
    brush_fair:
      label: Arbustal, condición regular
      table: TR-55 Tabla 2-2c
      cn: {A: 35, B: 56, C: 70, D: 77}
    residential_quarter_acre:
      label: Zona residencial, lotes de 1/4 acre (38 % impermeable)
      table: TR-55 Tabla 2-2a
      cn: {A: 61, B: 75, C: 83, D: 87}
    fallow_bare:
      label: Barbecho, suelo desnudo
      table: TR-55 Tabla 2-2b
      cn: {A: 77, B: 86, C: 91, D: 94}
    water:
      label: Agua libre (toda la lluvia escurre)
      table: NEH 630 cap. 10, Tabla 10-1 (CN 100, S = 0)
      cn: {A: 100, B: 100, C: 100, D: 100}

# Cobertura MODIS MCD12Q1 (IGBP) a tipo de cobertura de TR-55. Es un supuesto de modelado: la
# clase satelital no dice la práctica ni la condición hidrológica.
igbp_to_cover:
  assumption: >-
    Los cultivos se toman con rastrojo en superficie (siembra directa, la práctica más difundida
    en la región) y condición buena. Pastizales, montes y arbustales en condición regular por no
    tener dato de su estado. Zona urbana como residencial de 1/4 acre. Humedales como agua libre.
    El simulador permite cambiar el supuesto de rastrojo.
  classes:
    1: woods_fair
    2: woods_fair
    3: woods_fair
    4: woods_fair
    5: woods_fair
    6: brush_fair
    7: brush_fair
    8: woods_grass_fair
    9: woods_grass_fair
    10: pasture_fair
    11: water
    12: row_crops_sr_cr_good
    13: residential_quarter_acre
    14: row_crops_sr_cr_good
    15: water
    16: fallow_bare
    17: water

igbp_labels:
  1: Bosque siempreverde de coníferas
  2: Bosque siempreverde latifoliado
  3: Bosque caducifolio de coníferas
  4: Bosque caducifolio latifoliado
  5: Bosque mixto
  6: Arbustal cerrado
  7: Arbustal abierto
  8: Sabana arbolada
  9: Sabana
  10: Pastizal
  11: Humedal permanente
  12: Cultivos
  13: Urbano
  14: Mosaico de cultivos y vegetación natural
  15: Nieve o hielo
  16: Suelo desnudo
  17: Agua

# Grupo hidrológico según la textura de la capa superficial
hydrologic_soil_groups:
  source: TR-55 (1986), Apéndice A (Brakensiek y Rawls 1983)
  texture:
    sand: A
    loamy sand: A
    sandy loam: A
    silt loam: B
    loam: B
    sandy clay loam: C
    clay loam: D
    silty clay loam: D
    sandy clay: D
    silty clay: D
    clay: D
  # la clase "silt" no figura en la lista de TR-55: se toma como la más cercana (silt loam)
  unlisted:
    silt: B

# Condición de escurrimiento antecedente (ARC). CN para ARC I (seco) y III (húmedo) a partir
# de ARC II
antecedent_runoff_condition:
  source: USDA NRCS, NEH Parte 630, cap. 10 (julio 2004), Tabla 10-1
  note: >-
    NEH 630 cap. 10 aclara que la lluvia de 5 días previos explica mal la dispersión del CN. Por
    eso no se elige ARC por un umbral: cada evento se calcula en ARC II con el rango ARC I a
    ARC III, y la humedad SMAP y la lluvia previa se muestran como contexto.
