# Pesos del puntaje de sustentabilidad (0 a 100). Ver CLAUDE.md, sección 9.
#
# Decisión del equipo (14/11/2026): pesos iguales, 20 puntos por criterio. Es la regla
# más simple y transparente; no sale de una fuente y el puntaje se marca como provisional.

weights:
  no_land_use_change_since_2020: 20
  no_till: 20
  winter_cover: 20
  rotation: 20
  no_burn: 20
