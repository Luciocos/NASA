<figure class="frame" [attr.aria-labelledby]="title() ? titleId : null">
  @if (title(); as text) {
    <figcaption class="frame__title" [id]="titleId">{{ text }}</figcaption>
  }
  @if (empty()) {
    <p class="frame__empty">{{ emptyText() }}</p>
  } @else {
    <ng-content />
    @if (table(); as data) {
      <details class="frame__data">
        <summary>Ver datos</summary>
        <div class="frame__scroll" role="region" tabindex="0" [attr.aria-label]="data.caption">
          <table>
            <caption>
              {{
                data.caption
              }}
            </caption>
            <thead>
              <tr>
                @for (column of data.columns; track $index) {
                  <th scope="col">{{ column }}</th>
                }
              </tr>
            </thead>
            <tbody>
              @for (row of data.rows; track $index) {
                <tr>
                  @for (cell of row; track $index) {
                    @if ($first) {
                      <th scope="row">{{ cell }}</th>
                    } @else {
                      <td>{{ cell }}</td>
                    }
                  }
                </tr>
              }
            </tbody>
          </table>
        </div>
      </details>
    }
  }
</figure>
