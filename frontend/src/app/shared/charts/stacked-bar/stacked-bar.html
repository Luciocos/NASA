<app-chart-frame [title]="title()" [empty]="empty()" [emptyText]="emptyText()" [table]="table()">
  @if (!empty()) {
    @let v = view();
    <svg
      class="plot"
      role="img"
      [attr.aria-label]="label()"
      [attr.viewBox]="'0 0 ' + v.width + ' ' + v.height"
      [attr.width]="v.width"
      [attr.height]="v.height"
    >
      <defs>
        <pattern
          [attr.id]="uid + '-declared'"
          width="6"
          height="6"
          patternUnits="userSpaceOnUse"
          patternTransform="rotate(45)"
        >
          <rect class="tx-declared-bg" width="6" height="6" />
          <rect class="tx-declared" width="2.5" height="6" />
        </pattern>
        <pattern [attr.id]="uid + '-estimated'" width="5" height="5" patternUnits="userSpaceOnUse">
          <rect class="tx-estimated-bg" width="5" height="5" />
          <circle class="tx-estimated" cx="2.5" cy="2.5" r="1.1" />
        </pattern>
        <pattern
          [attr.id]="uid + '-nodata'"
          width="6"
          height="6"
          patternUnits="userSpaceOnUse"
          patternTransform="rotate(-45)"
        >
          <rect class="tx-nodata" width="1.5" height="6" />
        </pattern>
      </defs>
      @for (segment of v.segments; track segment.key; let i = $index) {
        <path
          class="seg grow"
          [class]="'tone-' + segment.tone"
          [class.seg--textured]="segment.fill !== null"
          [style.--i]="i"
          [style.fill]="segment.fill"
          [attr.d]="segment.d"
        >
          <title>{{ segment.hint }}</title>
        </path>
      } @empty {
        <rect
          class="missing"
          rx="4"
          [attr.width]="v.width"
          [attr.height]="v.height"
          [style.fill]="v.noData"
        />
        <rect class="missing__plate" rx="2" x="6" y="3" width="62" height="14" />
        <text x="10" y="14">No data</text>
      }
    </svg>
    <ul class="legend">
      @for (item of legend(); track item.key) {
        <li>
          <svg width="14" height="14" aria-hidden="true">
            <rect
              class="seg"
              [class]="'tone-' + item.tone"
              [class.seg--textured]="item.fill !== null"
              [style.fill]="item.fill"
              x="0.5"
              y="0.5"
              width="13"
              height="13"
              rx="3"
            />
          </svg>
          <span>
            {{ item.label }} <strong>{{ item.value }}</strong> · {{ item.share }}
          </span>
        </li>
      }
    </ul>
  }
</app-chart-frame>
