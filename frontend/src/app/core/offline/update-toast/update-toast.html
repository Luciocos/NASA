@if (notice(); as kind) {
  <div class="toast" animate.enter="toast-in" animate.leave="toast-out">
    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <path d="M16.2 10a6.2 6.2 0 1 1-1.9-4.5M16.4 3.2v3.1h-3.1" />
    </svg>
    @if (kind === 'update') {
      <p>A new version of LoTestigo is available</p>
      <button type="button" class="primary" (click)="reload()">Update</button>
      <button type="button" (click)="dismiss()">Later</button>
    } @else {
      <p>LoTestigo needs to reload to keep working</p>
      <button type="button" class="primary" (click)="reload()">Reload</button>
    }
  </div>
}
