<svg
  class="scene"
  viewBox="0 0 260 176"
  role="img"
  focusable="false"
  [attr.aria-label]="description()"
  [attr.data-step]="step()"
>
  <defs>
    <clipPath [attr.id]="id('map')">
      <rect x="8" y="30" width="152" height="138" rx="8" />
    </clipPath>
    <clipPath [attr.id]="id('field')">
      <rect x="8" y="8" width="148" height="160" rx="10" />
    </clipPath>
    <clipPath [attr.id]="id('zones')">
      <path d="M9 70h150v90a9 9 0 0 1-9 9H18a9 9 0 0 1-9-9z" />
    </clipPath>
    <clipPath [attr.id]="id('lot')">
      <polygon points="38,80 128,76 134,160 32,164" />
    </clipPath>
    <pattern [attr.id]="id('iso')" patternUnits="userSpaceOnUse" width="24" height="12">
      <path d="M0 0 24 12M24 0 0 12" fill="none" stroke="#d6decb" stroke-width="0.6" />
    </pattern>
  </defs>

  <rect class="bg" width="260" height="176" />

  @if (popup()) {
    <!-- encabezado del popup del lote: nombre, lugar, el menú ⋯ y cerrar -->
    <rect class="ink" x="12" y="10" width="58" height="7" rx="3.5" />
    <rect class="soft" x="76" y="11.25" width="30" height="4.5" rx="2.25" />
    @if (step() === 'pasaporte') {
      <rect class="pressed s9-pressed" x="209" y="4.5" width="18" height="18" rx="5" />
    }
    <path class="ico c-link" [attr.d]="icons.more" transform="translate(212 7.5) scale(0.5)" />
    <path class="ico c-link" [attr.d]="icons.close" transform="translate(234 7.5) scale(0.5)" />
    <line class="rule" x1="0" y1="40.5" x2="260" y2="40.5" />
    @for (tab of tabs(); track tab.key) {
      <g [attr.transform]="'translate(' + tab.x + ' 0)'">
        <path
          class="ico"
          [class.c-green]="tab.active"
          [class.c-muted]="!tab.active"
          [attr.d]="tab.icon"
          transform="translate(6 26) scale(0.5)"
        />
        @if (tab.active) {
          <text class="t-ink" x="21" y="35.3" font-size="9">{{ tab.label }}</text>
          <rect class="green" x="3" y="38.5" [attr.width]="tab.width - 6" height="2.5" rx="1.25" />
        }
      </g>
    }
    @if (sequence()) {
      <!-- primero se toca la pestaña: el aro está ahí al empezar la secuencia -->
      <g class="seq-ring1">
        <rect
          class="ring-halo"
          [attr.x]="activeTab().x + 1"
          y="23"
          [attr.width]="activeTab().width - 2"
          height="18.5"
          rx="6"
        />
        <rect
          class="ring"
          [attr.x]="activeTab().x + 1"
          y="23"
          [attr.width]="activeTab().width - 2"
          height="18.5"
          rx="6"
        />
      </g>
    }
  }

  @switch (step()) {
    @case ('marcar') {
      <!-- barra de la app: la marca, Mi campo y Marcar lote (elegido) -->
      <rect class="surface" width="260" height="24" />
      <line class="rule" x1="0" y1="24.5" x2="260" y2="24.5" />
      <g transform="translate(10 3.5)">
        <path fill="#12401f" d="M0 12.5v1.6l7 3.5 7-3.5v-1.6l-7 3.5z" />
        <path fill="#1b6e3a" d="M0 12.5 7 9l7 3.5L7 16z" />
        <path fill="#c9d1c6" d="M0 8.5v1.4l7 3.5 7-3.5V8.5L7 12z" />
        <path fill="#ffffff" d="M0 8.5 7 5l7 3.5L7 12z" />
        <path fill="#12305a" d="M0 4.5v1.4l7 3.5 7-3.5V4.5L7 8z" />
        <path fill="#1f4e8c" d="M0 4.5 7 1l7 3.5L7 8z" />
      </g>
      <path class="ico c-muted" [attr.d]="icons.map" transform="translate(32 6) scale(0.5)" />
      <rect class="soft" x="46" y="10" width="24" height="4" rx="2" />
      <rect class="pill-active" x="78" y="4" width="80" height="16" rx="8" />
      <path class="ico c-green" [attr.d]="icons.plus" transform="translate(84 6) scale(0.5)" />
      <text class="t-green" x="98" y="15.1" font-size="8.5">Marcar lote</text>
      <circle class="green" cx="246" cy="12" r="6" />

      <!-- la imagen satelital: potreros, caminos y montes -->
      <g [attr.clip-path]="url('map')">
        <rect fill="#d3cbb0" x="8" y="30" width="152" height="138" />
        <path fill="#9aa86d" d="M8 30h56l-5 50-51 4z" />
        <path fill="#b8a679" d="M67 30h93v36l-98 11z" />
        <path fill="#6f8a4c" d="M8 87l50-4-4 85H8z" />
        <path fill="#93a462" d="M62 80l98-11v52l-102 8z" />
        <path fill="#a8916b" d="M57 132l103-8v44H55z" />
        <path
          d="M74 38l80-9M73 46l81-9M72 54l82-9M71 62l83-9M12 100l40-3M11 112l41-3M11 124l40-3M10 136l41-3M10 148l40-3"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.18"
          stroke-width="1"
        />
        <g fill="#4c5f35">
          <circle cx="22" cy="104" r="2.4" />
          <circle cx="27" cy="109" r="2.6" />
          <circle cx="32" cy="103" r="2.2" />
          <circle cx="29" cy="114" r="2.3" />
          <circle cx="35" cy="110" r="2.5" />
          <circle cx="132" cy="146" r="2.3" />
          <circle cx="137" cy="150" r="2.5" />
          <circle cx="141" cy="145" r="2.1" />
        </g>
      </g>
      <rect class="frame" x="8" y="30" width="152" height="138" rx="8" />

      <!-- la indicación de arriba del mapa -->
      <rect class="float" x="34" y="36" width="100" height="14" rx="7" />
      <path class="ico c-green" [attr.d]="icons.pin" transform="translate(39.5 37) scale(0.5)" />
      <rect class="ink-2" x="54" y="41.25" width="72" height="3.5" rx="1.75" />

      <!-- el perímetro que se va trazando, esquina por esquina -->
      <polygon class="lot-fill s1-c4" points="72,90 148,82 152,116 76,124" />
      <g class="s1-c2">
        <line class="edge-halo" x1="72" y1="90" x2="148" y2="82" />
        <line class="edge" x1="72" y1="90" x2="148" y2="82" />
      </g>
      <g class="s1-c3">
        <line class="edge-halo" x1="148" y1="82" x2="152" y2="116" />
        <line class="edge" x1="148" y1="82" x2="152" y2="116" />
      </g>
      <g class="s1-c4">
        <line class="edge-halo" x1="152" y1="116" x2="76" y2="124" />
        <line class="edge" x1="152" y1="116" x2="76" y2="124" />
        <line class="edge-halo" x1="76" y1="124" x2="72" y2="90" />
        <line class="edge" x1="76" y1="124" x2="72" y2="90" />
        <rect class="night" x="98" y="100" width="28" height="10" rx="5" />
        <rect class="night-ink" x="103" y="103.75" width="18" height="2.5" rx="1.25" />
      </g>
      <circle class="corner s1-c1" cx="72" cy="90" r="3.4" />
      <circle class="corner s1-c2" cx="148" cy="82" r="3.4" />
      <circle class="corner s1-c3" cx="152" cy="116" r="3.4" />
      <circle class="corner s1-c4" cx="76" cy="124" r="3.4" />

      <!-- el panel: nombre, superficie y Guardar lote -->
      <rect class="card" x="166" y="30" width="86" height="138" rx="8" />
      <rect class="ink-2" x="174" y="39" width="34" height="3.5" rx="1.75" />
      <rect class="input" x="174" y="46" width="70" height="13" rx="4" />
      <rect class="soft" x="178" y="51" width="26" height="3" rx="1.5" />
      <rect class="field-50" x="174" y="64" width="70" height="26" rx="5" />
      <rect class="ink-3" x="179" y="69.5" width="30" height="3" rx="1.5" />
      <rect class="ink" x="179" y="77" width="16" height="5.5" rx="1.5" />
      <rect class="badge-d" x="219" y="76" width="20" height="7" rx="3.5" />
      <rect class="frame" x="174" y="96" width="70" height="12" rx="4" />
      <rect class="soft" x="179" y="100.5" width="34" height="3" rx="1.5" />
      <rect class="frame" x="174" y="112" width="70" height="12" rx="4" />
      <rect class="soft" x="179" y="116.5" width="40" height="3" rx="1.5" />
      <line class="rule" x1="166" y1="132.5" x2="252" y2="132.5" />
      <g class="s1-save">
        <rect class="green" x="170" y="140" width="78" height="18" rx="5" />
        <path class="ico c-white" [attr.d]="icons.save" transform="translate(175 143) scale(0.5)" />
        <text class="t-white" x="189" y="151.8" font-size="8">Guardar lote</text>
      </g>

      <g class="s1-ring1">
        <rect class="ring-halo" x="75" y="1" width="86" height="22" rx="11" />
        <rect class="ring" x="75" y="1" width="86" height="22" rx="11" />
      </g>
      <g class="s1-ring2">
        <rect class="ring-halo" x="167" y="137" width="84" height="24" rx="8" />
        <rect class="ring" x="167" y="137" width="84" height="24" rx="8" />
      </g>
    }

    @case ('abrir') {
      <!-- la maqueta de Mi campo con los lotes en bloques -->
      <g [attr.clip-path]="url('field')">
        <rect fill="#edf1e6" x="8" y="8" width="148" height="160" />
        <rect [attr.fill]="url('iso')" x="8" y="8" width="148" height="160" />
        <!-- lote de atrás -->
        <path fill="#96633f" d="M22 74l40 20v6L22 80z" />
        <path fill="#6b4429" d="M62 94l40-20v6l-40 20z" />
        <path fill="#c9a27c" d="M22 74l40-20 40 20-40 20z" />
        <!-- lote chico -->
        <path fill="#b08a2e" d="M18 136l22 11v5l-22-11z" />
        <path fill="#8a6a1e" d="M40 147l22-11v5l-22 11z" />
        <path fill="#dcb651" d="M18 136l22-11 22 11-22 11z" />
        <!-- el lote elegido, con su borde ámbar y su nombre -->
        <path fill="#3d9a4f" d="M66 122l38 19v6l-38-19z" />
        <path fill="#1b6e3a" d="M104 141l38-19v6l-38 19z" />
        <path class="lot-picked" d="M66 122l38-19 38 19-38 19z" />
        <rect class="night" x="86" y="116" width="36" height="11" rx="5.5" />
        <rect class="night-ink" x="92" y="120.25" width="24" height="2.5" rx="1.25" />
        <!-- la barra de la maqueta -->
        <rect class="night" x="14" y="14" width="62" height="16" rx="5" />
        <path
          class="ico c-night"
          [attr.d]="icons['zoom-out']"
          transform="translate(17 16) scale(0.5)"
        />
        <path
          class="ico c-night"
          [attr.d]="icons['zoom-in']"
          transform="translate(30 16) scale(0.5)"
        />
        <path class="ico c-night" [attr.d]="icons.rotate" transform="translate(43 16) scale(0.5)" />
        <line class="night-sep" x1="57.5" y1="17" x2="57.5" y2="27" />
        <path class="ico c-night" [attr.d]="icons.layers" transform="translate(60 16) scale(0.5)" />
      </g>
      <rect class="frame" x="8" y="8" width="148" height="160" rx="10" />

      <!-- Tus lotes, con la lupa de cada uno -->
      <rect class="card" x="162" y="8" width="90" height="160" rx="10" />
      <text class="t-ink" x="170" y="24" font-size="9.5">Tus lotes</text>
      <rect class="soft" x="170" y="29" width="32" height="3.5" rx="1.75" />
      @for (row of lotRows; track row; let first = $first) {
        <rect
          [class]="first ? 'row-picked' : 'frame'"
          x="169"
          [attr.y]="row"
          width="76"
          height="28"
          rx="6"
        />
        <circle class="field-50" cx="180" [attr.cy]="row + 14" r="6.5" />
        <path
          class="ico c-green"
          [attr.d]="sowing"
          [attr.transform]="'translate(175.5 ' + (row + 9.5) + ') scale(0.375)'"
        />
        <rect class="ink" x="190" [attr.y]="row + 8" width="28" height="4.5" rx="2.25" />
        <rect class="soft" x="190" [attr.y]="row + 16" width="22" height="3.5" rx="1.75" />
        <path
          class="ico c-green"
          [attr.d]="icons.search"
          [attr.transform]="'translate(227 ' + (row + 8) + ') scale(0.5)'"
        />
      }

      <circle class="ring-halo" cx="233" cy="52" r="9.5" />
      <circle class="ring" cx="233" cy="52" r="9.5" />
      <circle class="flash" cx="233" cy="52" r="12.5" />
    }

    @case ('satelite') {
      <!-- Lo que ve el satélite: verdor, lluvia y humedad, y la curva del verdor -->
      <rect class="card" x="8" y="46" width="244" height="124" rx="9" />
      <rect class="ink" x="18" y="56" width="62" height="6" rx="3" />
      @for (kpi of kpis; track kpi.x) {
        <rect class="card-2" [attr.x]="kpi.x" y="68" width="66" height="50" rx="7" />
        <rect class="field-50" [attr.x]="kpi.x + 6" y="74" width="13" height="13" rx="4" />
        <path
          class="ico c-green"
          [attr.d]="kpi.icon"
          [attr.transform]="'translate(' + (kpi.x + 7.5) + ' 75.5) scale(0.42)'"
        />
        <rect class="ink-2" [attr.x]="kpi.x + 23" y="78.5" width="32" height="4" rx="2" />
        <rect class="ink" [attr.x]="kpi.x + 6" y="94" [attr.width]="kpi.value" height="8" rx="2" />
        <rect
          class="soft"
          [attr.x]="kpi.x + 9 + kpi.value"
          y="98"
          width="8"
          height="3.5"
          rx="1.75"
        />
        <rect [class]="kpi.badge" [attr.x]="kpi.x + 6" y="107" width="24" height="6.5" rx="3.25" />
      }
      <path
        class="area"
        d="M18 156C40 152 52 128 74 132S110 152 132 146 168 126 190 132 226 150 242 140V162H18z"
      />
      <path
        class="curve"
        d="M18 156C40 152 52 128 74 132S110 152 132 146 168 126 190 132 226 150 242 140"
      />
      <line class="rule" x1="18" y1="162.5" x2="242" y2="162.5" />

      <rect
        class="ring-halo"
        [attr.x]="activeTab().x + 1"
        y="23"
        [attr.width]="activeTab().width - 2"
        height="18.5"
        rx="6"
      />
      <rect
        class="ring"
        [attr.x]="activeTab().x + 1"
        y="23"
        [attr.width]="activeTab().width - 2"
        height="18.5"
        rx="6"
      />
      <rect
        class="flash"
        [attr.x]="activeTab().x - 2"
        y="20"
        [attr.width]="activeTab().width + 4"
        height="24.5"
        rx="9"
      />
    }

    @case ('huella') {
      <!-- la huella todavía sin calcular, con Cargar rinde e insumos -->
      <rect class="card" x="8" y="46" width="244" height="72" rx="9" />
      <rect class="accent-bar" x="9" y="52" width="2.5" height="60" rx="1.25" />
      <rect class="ink-3" x="18" y="55" width="44" height="3.5" rx="1.75" />
      <rect class="ink" x="18" y="62" width="92" height="8" rx="2" />
      <rect class="chip-warn" x="18" y="75" width="22" height="7" rx="3.5" />
      <rect class="chip-warn" x="43" y="75" width="26" height="7" rx="3.5" />
      <rect class="chip-warn" x="72" y="75" width="30" height="7" rx="3.5" />
      <rect class="green" x="18" y="89" width="140" height="19" rx="5" />
      <path class="ico c-white" [attr.d]="icons.plus" transform="translate(23 92.5) scale(0.5)" />
      <text class="t-white" x="37" y="101.6" font-size="9">Cargar rinde e insumos</text>
      <rect class="link" x="176" y="97" width="58" height="3.5" rx="1.75" />
      <path
        class="ico c-link"
        [attr.d]="icons['arrow-right']"
        transform="translate(237 95.75) scale(0.25)"
      />

      <!-- Resumen, Desglose, Simulador y Tus datos -->
      <rect class="seg" x="8" y="124" width="128" height="15" rx="5" />
      <rect class="surface" x="10" y="126" width="30" height="11" rx="3.5" />
      <rect class="ink" x="15" y="130" width="20" height="3" rx="1.5" />
      <rect class="soft" x="46" y="130" width="22" height="3" rx="1.5" />
      <rect class="soft" x="76" y="130" width="24" height="3" rx="1.5" />
      <rect class="soft" x="108" y="130" width="20" height="3" rx="1.5" />
      @for (col of columns; track col) {
        <rect class="card" [attr.x]="col" y="145" width="76" height="30" rx="7" />
        <rect class="ink" [attr.x]="col + 8" y="153" width="40" height="4" rx="2" />
        <rect class="soft" [attr.x]="col + 8" y="161" width="54" height="3" rx="1.5" />
      }

      <g class="seq-ring2">
        <rect class="ring-halo" x="15" y="86" width="146" height="25" rx="8" />
        <rect class="ring" x="15" y="86" width="146" height="25" rx="8" />
      </g>
      <rect class="flash seq-flash" x="12" y="83" width="152" height="31" rx="10" />
    }

    @case ('practicas') {
      <!-- buenas prácticas, a la izquierda -->
      <rect class="card" x="8" y="46" width="88" height="124" rx="9" />
      <rect class="ink" x="16" y="55" width="50" height="5.5" rx="2.75" />
      <rect class="soft" x="16" y="64" width="60" height="3.5" rx="1.75" />
      <rect class="ink-3" x="16" y="74" width="36" height="3" rx="1.5" />
      @for (top of practiceRows; track top) {
        <rect class="card-2" x="16" [attr.y]="top" width="72" height="24" rx="6" />
        <circle class="field-100" cx="25" [attr.cy]="top + 12" r="4.5" />
        <rect class="ink" x="34" [attr.y]="top + 7.5" width="44" height="3.5" rx="1.75" />
        <rect class="soft" x="34" [attr.y]="top + 14" width="30" height="3" rx="1.5" />
      }

      <!-- Uso del suelo: las dos respuestas; la mano señala las dos, sin elegir por vos -->
      <rect class="card" x="102" y="46" width="150" height="124" rx="9" />
      <text class="t-ink" x="110" y="60" font-size="9.5">Uso del suelo</text>
      <rect class="ink-2" x="110" y="67" width="112" height="4" rx="2" />
      <rect class="ink-2" x="110" y="74" width="66" height="4" rx="2" />
      <rect class="input" x="110" y="84" width="134" height="20" rx="5" />
      <path class="ico c-ink" [attr.d]="icons.check" transform="translate(115 88) scale(0.5)" />
      <text class="t-ink" x="129" y="97.2" font-size="8.5">No cambié el uso</text>
      <rect class="input" x="110" y="108" width="134" height="20" rx="5" />
      <path class="ico c-ink" [attr.d]="icons.sync" transform="translate(115 112) scale(0.5)" />
      <text class="t-ink" x="129" y="121.2" font-size="8.5">Sí, hubo un cambio</text>
      <line class="rule" x1="110" y1="136.5" x2="244" y2="136.5" />
      @for (tile of coverTiles; track $index) {
        <rect
          [attr.x]="110 + $index * 27.75"
          y="143"
          width="23"
          height="15"
          rx="3"
          [attr.fill]="tile"
        />
      }

      <g class="seq-ring2">
        <rect class="ring-halo" x="106" y="80" width="142" height="52" rx="8" />
        <rect class="ring" x="106" y="80" width="142" height="52" rx="8" />
      </g>
      <rect class="flash seq-flash" x="103" y="77" width="148" height="58" rx="10" />
    }

    @case ('rentabilidad') {
      <!-- el margen todavía sin dato -->
      @for (top of marginCards; track top; let first = $first) {
        <rect class="card" x="8" [attr.y]="top" width="110" height="58" rx="9" />
        @if (first) {
          <rect class="field-50" x="16" [attr.y]="top + 9" width="13" height="13" rx="4" />
          <path
            class="ico c-green"
            [attr.d]="icons.coins"
            [attr.transform]="'translate(17.5 ' + (top + 10.5) + ') scale(0.42)'"
          />
        }
        <rect
          class="ink-2"
          [attr.x]="first ? 34 : 16"
          [attr.y]="top + 13.5"
          width="58"
          height="4"
          rx="2"
        />
        <rect class="soft" x="16" [attr.y]="top + 29" width="34" height="7" rx="2" />
        <rect class="soft" x="16" [attr.y]="top + 42" width="74" height="3.5" rx="1.75" />
      }

      <!-- Tus números: precio, rinde y costos -->
      <rect class="card" x="124" y="46" width="128" height="124" rx="9" />
      <rect class="ink" x="132" y="54" width="52" height="5" rx="2.5" />
      <text class="t-ink-2" x="132" y="70" font-size="8.5">Precio del grano</text>
      <rect class="input" x="132" y="76" width="112" height="16" rx="4" />
      <rect class="caret ink" x="137" y="79.5" width="1" height="9" rx="0.5" />
      <rect class="soft" x="132" y="97.5" width="62" height="3" rx="1.5" />
      <text class="t-ink-2" x="132" y="113" font-size="8.5">Rinde</text>
      <rect class="input" x="132" y="117" width="112" height="16" rx="4" />

        <rect class="ring" x="133" y="28" width="118" height="24" rx="6" />
