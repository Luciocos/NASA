@if (radarUrl(); as radar) {
  @if (opticalUrl(); as optical) {
    <div class="seg" role="group" aria-label="How to view both images">
      <button
        type="button"
        [attr.aria-pressed]="mode() === 'overlay'"
        (click)="mode.set('overlay')"
      >
        Overlaid
      </button>
      <button type="button" [attr.aria-pressed]="mode() === 'side'" (click)="mode.set('side')">
        Side by side
      </button>
    </div>

    @if (mode() === 'overlay') {
      <div
        class="overlay"
        role="group"
        [attr.aria-label]="
          'Overlaid images: on the left ' + radarLabel() + ', on the right ' + opticalLabel()
        "
      >
        <img class="overlay__base" [src]="optical" alt="" (error)="onImageError('optical')" />
        <img
          class="overlay__top"
          [src]="radar"
          alt=""
          [style.clip-path]="'inset(0 ' + (100 - split()) + '% 0 0)'"
          (error)="onImageError('radar')"
        />
        <div class="overlay__handle" [style.left.%]="split()" aria-hidden="true">
          <span class="overlay__knob">
            <app-icon name="chevron-left" /><app-icon name="chevron-right" />
          </span>
        </div>
        <span class="overlay__tag overlay__tag--left" aria-hidden="true">{{ radarTag() }}</span>
        <span class="overlay__tag overlay__tag--right" aria-hidden="true">{{ opticalTag() }}</span>
        <input
          class="overlay__range"
          type="range"
          min="0"
          max="100"
          [value]="split()"
          (input)="onSplitInput($any($event.target).value)"
          [attr.aria-label]="'Visible percentage of ' + radarLabel()"
          [attr.aria-valuetext]="split() + '% of the radar image'"
        />
      </div>
    } @else {
      <div class="side-by-side">
        <figure>
          <img [src]="radar" [alt]="radarLabel()" (error)="onImageError('radar')" />
          <figcaption>{{ radarLabel() }}</figcaption>
        </figure>
        <figure>
          <img [src]="optical" [alt]="opticalLabel()" (error)="onImageError('optical')" />
          <figcaption>{{ opticalLabel() }}</figcaption>
        </figure>
      </div>
    }
  } @else {
    <figure>
      <img [src]="radar" [alt]="radarLabel()" (error)="onImageError('radar')" />
      <figcaption>{{ radarLabel() }}</figcaption>
    </figure>
  }
} @else if (opticalUrl(); as optical) {
  <figure>
    <img [src]="optical" [alt]="opticalLabel()" (error)="onImageError('optical')" />
    <figcaption>{{ opticalLabel() }}</figcaption>
  </figure>
}

@if (missing(); as note) {
  <p class="missing"><app-icon name="satellite" /> {{ note }}</p>
}
